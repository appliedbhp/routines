<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open an ABHP file | Tools</title><link rel="stylesheet" href="../supports/style.css"><link rel="stylesheet" href="../css/workspace.css"><link rel="stylesheet" href="../css/visual-system.css"><link rel="manifest" href="../manifest.webmanifest"><script src="../js/workspace.js" defer></script></head><body><main><h1>Open an ABHP file</h1><p>Drag a saved file onto this page, or choose a board, routine, or setup. We’ll open the right tool. Older JSON exports still work.</p><img src="../assets/abhp-file.svg" width="56" height="56" alt="ABHP document"><p><label>Choose file <input id="openFile" type="file" accept=".abhp,.json,application/json"></label></p><p id="openStatus" role="status"></p><p>Installed apps on supported browsers can open .abhp files directly. Your device decides whether it displays the custom icon.</p></main><script type="module">await import('../js/audience.js');globalThis.ABHPFileScriptURL=new URL('../js/abhp-files.js',location.href).href;await import(globalThis.ABHPFileScriptURL);async function open(file){try{await ABHPFiles.route(file);}catch(e){document.getElementById('openStatus').textContent=e.message;}}document.getElementById('openFile').onchange=e=>{if(e.target.files[0])open(e.target.files[0]);};if('launchQueue' in window)launchQueue.setConsumer(async p=>{if(p.files.length)open(await p.files[0].getFile());});</script></body></html>
