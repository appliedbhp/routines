<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Routines administration</title>
<link rel="stylesheet" href="../supports/style.css">
<link rel="stylesheet" href="../css/workspace.css">
<link rel="stylesheet" href="../css/visual-system.css">
<script src="../js/workspace.js" defer></script>
<link rel="stylesheet" href="visuals.css?v=object-mode"><script type="module" src="visuals.js?v=object-mode"></script></head>
<body>
<main id="adminWorkspace">
<h1>Administration</h1>
<p id="adminStatus" role="status">Checking administrator access…</p>
<section id="adminTools" class="portal-admin-tools" hidden>
<div class="portal-panel">
<h2>Find a user</h2>
<form id="adminSearch"><label>Email address<input id="adminEmail" type="email" maxlength="254" required autocomplete="off"></label><button class="primary">Search</button></form>
<p id="searchStatus" role="status"></p>
<div id="searchResult"></div>
</div>
<section id="bugLog" class="portal-panel"><h2>Bug-fixing log</h2><p>Reports are sorted by priority, then oldest first. “Can’t complete my task” starts as High.</p><label>Show <select id="bugFilter"><option value="open">Open reports</option><option value="closed">Fixed / closed</option><option value="all">All reports</option></select></label> <button id="bugRefresh" type="button">Refresh reports</button><p id="bugLogStatus" role="status"></p><div id="bugReports"></div><button id="bugMore" type="button" hidden>Load more reports</button></section><script type="module" src="bugs.js"></script>
<section id="visualLibrary" class="portal-panel"></section>
<div class="portal-panel"><h2>Billing</h2><p>Beta lifetime purchases are managed in Stripe. <a href="../beta/">View beta offers</a>.</p></div>
</section>
</main>
<script type="module" src="../bugs/widget.js"></script>
</body>
</html>
