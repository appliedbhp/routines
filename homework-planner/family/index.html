<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Class homework · Applied Behavioral Health Practice</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../sharing.css?v=3">
<script src="../../self-monitor/vendor/qrcode.js" defer></script>
<script src="../pdf.js?v=3" defer></script>
<script type="module" src="app.js?v=3"></script>
<style>@page { size: letter landscape; margin: .45in; }</style>
</head>
<body class="homework-family">
<main>
<section class="family-screen">
<header class="family-heading">
<a href="../../">Applied Behavioral Health Practice</a>
<h1 id="classTitle">Class homework</h1>
<p id="week"></p>
<p id="updated" class="family-muted"></p>
</header>
<p id="loadStatus" role="status">Opening the homework chart…</p>
<div id="familyTools" hidden>
<nav class="family-actions" aria-label="Print copies">
<button id="printStudent" type="button">Prepare student PDF</button>
<button id="printParent" type="button">Prepare family PDF</button>
</nav>
<p class="family-muted" id="pdfStatus" role="status">Choose a copy to prepare a PDF.</p>
<p class="homework-pdf-download"><a id="familyPDF" hidden>Save homework PDF</a></p>
<div class="family-tabs" role="group" aria-label="Homework view">
<button type="button" id="today" aria-pressed="true">Today</button>
<button type="button" id="fullWeek" aria-pressed="false">Full week</button>
</div>
<div id="assignments"></div>
</div>
</section>
<section id="printCopy" class="family-print"></section>
</main>
</body>
</html>
